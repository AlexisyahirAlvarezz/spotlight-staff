<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | SPOTLIGHT</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Botón para regresar al inicio -->
    <a href="index.html" class="volver-inicio">← Volver a la página principal</a>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="logo-blanco.jpg" alt="SPOTLIGHT" class="login-logo">
                <h2>Portal del Staff</h2>
                <p>Ingresa tus credenciales para acceder</p>
            </div>

            <!-- FORMULARIO DE LOGIN -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="usuario">Usuario o Correo</label>
                    <input type="text" id="usuario" placeholder="Ej. staff@spotlight.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">
                    Iniciar Sesión
                </button>
            </form>

            <div class="login-footer">
                <p>¿Olvidaste tu contraseña? <br> Contacta al administrador.</p>
            </div>
        </div>
    </div>

    <!-- Tu script normal -->
    <script src="login.js"></script>

    <!-- ============================================================ -->
    <!-- ONESIGNAL SDK (AQUÍ ESTÁ BIEN UBICADO) -->
    <!-- ============================================================ -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "6d8c12f8-ae11-467a-9af2-e2b5138f1650",
          notifyButton: {
            enable: true, // Esto hace que aparezca la campanita
          },
        });
      });
    </script>
</body>
</html>
